<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三国世界地图设计</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="workspace">
      <section class="design-panel">
        <header class="design-header">
          <div>
            <strong>三国与中央皇城</strong>
            <span id="world-summary" class="world-summary"></span>
          </div>
          <div class="interaction-hint">
            <span>点击传送点开始连线，再点击目标点完成 · Ctrl+右键断开连接 · Esc 取消 · 拖动地图调整位置</span>
            <span id="interaction-status" role="status" aria-live="polite"></span>
          </div>
          <div class="toolbar">
            <button id="zoom-out" type="button" aria-label="缩小">−</button>
            <span id="zoom-level">100%</span>
            <button id="zoom-in" type="button" aria-label="放大">+</button>
            <button id="auto-layout-button" type="button" title="根据已连接的传送点自动排列地图">一键排版</button>
            <button id="save-button" type="button">保存配置</button>
            <span id="save-status" role="status" aria-live="polite"></span>
          </div>
        </header>
        <div id="region-legend" class="region-legend"></div>
        <div id="map-board" class="map-board" aria-label="可拖动缩放的世界地图关系图">
          <div id="map-scene" class="map-scene">
            <svg id="connection-layer" class="connection-layer" aria-hidden="true"></svg>
            <div id="region-labels" class="region-labels"></div>
            <div id="map-nodes" class="map-nodes"></div>
          </div>
        </div>
      </section>
    </main>

    <dialog id="detail-dialog" class="detail-dialog">
      <form method="dialog">
        <button class="dialog-close" aria-label="关闭">×</button>
      </form>
      <div id="dialog-content"></div>
    </dialog>
  </body>
</html>
